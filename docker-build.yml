name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build Image
      run: |
        docker build -t ghcr.io/sebasvelasco353/trabajo-k8s-fe:latest .

    - name: Push Image
      run: |
        docker push ghcr.io/sebasvelasco353/trabajo-k8s-fe:latest
